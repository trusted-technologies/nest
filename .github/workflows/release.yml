name: release

# Release flow (see also the "Releasing" section in README.md):
#   build static binaries -> nfpm packages -> fetch restic/rclone helpers ->
#   build & GPG-sign apt/yum repos + sign sha256sums.txt ->
#   sync everything to the R2 mirror -> attach packages to the GitHub release.
#
# Required secrets:
#   GPG_PRIVATE_KEY       ascii-armored private key for repo signing
#   R2_ENDPOINT           e.g. https://<account-id>.r2.cloudflarestorage.com
#   R2_BUCKET             mirror bucket name
#   AWS_ACCESS_KEY_ID     R2 access key id
#   AWS_SECRET_ACCESS_KEY R2 secret access key

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# The GITHUB_TOKEN is only needed by the Create-GitHub-release step (tag
# builds). checkout uses persist-credentials: false so scripts and tools
# running in this job never see the token.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Publishes to the production mirror. Add required reviewers to the
    # "production" environment in the repo settings to turn publishing into
    # an approval-gated step.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publishing must only ever happen from main or a tag: workflow_dispatch
      # can be started from any branch (with modified scripts), so guard it.
      - name: Guard ref
        run: |
          case "${{ github.ref }}" in
            refs/heads/main|refs/tags/*) ;;
            *) echo "refusing to publish from ${{ github.ref }}" >&2; exit 1 ;;
          esac

      # Versioning: tag pushes keep their semver (build.sh prefers the exact
      # tag); every other run gets an auto-incrementing 1.0.<run-number>, so
      # each publish to the mirror is a newer package version for apt/dnf.
      - name: Resolve version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag build — version comes from the tag"
          else
            echo "1.0.${{ github.run_number }}" > VERSION
            echo "auto version: $(cat VERSION)"
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"

      # nfpm is pinned: an unpinned @latest tool would run its code next to
      # the GPG signing key and R2 credentials on every release.
      - name: Install packaging tools
        run: |
          command -v aws || { echo "error: aws CLI missing on runner" >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm bzip2 unzip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build binaries
        run: ./scripts/build.sh

      - name: Build packages (deb/rpm)
        run: ./scripts/package.sh

      # The GPG key is imported as late as possible — only the steps below
      # (helper checksums + repo metadata) sign anything.
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$fpr" || { echo "no secret key imported" >&2; exit 1; }
          echo "NEST_GPG_KEY=$fpr" >> "$GITHUB_ENV"

      # Verifies upstream checksums and signs sha256sums.txt (clients verify
      # the signature before running any downloaded binary).
      - name: Fetch helper tools (restic, rclone)
        run: ./scripts/fetch-tools.sh

      - name: Build apt repository
        run: ./scripts/make-apt-repo.sh

      - name: Build yum repository
        run: ./scripts/make-yum-repo.sh

      - name: Publish to the mirror (Cloudflare R2)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ./scripts/publish.sh

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/packages/*
