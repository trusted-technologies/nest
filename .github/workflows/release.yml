name: release

# Release flow (see also the "Releasing" section in README.md):
#   build static binaries -> nfpm packages -> fetch restic/rclone helpers ->
#   build & GPG-sign apt/yum repos -> sync everything to the R2 mirror ->
#   attach packages to the GitHub release.
#
# Required secrets:
#   GPG_PRIVATE_KEY       ascii-armored private key for repo signing
#   R2_ENDPOINT           e.g. https://<account-id>.r2.cloudflarestorage.com
#   R2_BUCKET             mirror bucket name
#   AWS_ACCESS_KEY_ID     R2 access key id
#   AWS_SECRET_ACCESS_KEY R2 secret access key

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm awscli bzip2 unzip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Import GPG signing key
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$fpr" || { echo "no secret key imported" >&2; exit 1; }
          echo "NEST_GPG_KEY=$fpr" >> "$GITHUB_ENV"

      - name: Build binaries
        run: ./scripts/build.sh

      - name: Build packages (deb/rpm)
        run: ./scripts/package.sh

      - name: Fetch helper tools (restic, rclone)
        run: ./scripts/fetch-tools.sh

      - name: Build apt repository
        run: ./scripts/make-apt-repo.sh

      - name: Build yum repository
        run: ./scripts/make-yum-repo.sh

      - name: Publish to the mirror (Cloudflare R2)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ./scripts/publish.sh

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
